packages:
  - support/*
  - packages/*
  - examples

# Every external dependency's version; packages refer to it with `catalog:`.
catalog:
  '@fast-check/vitest': 0.5.0
  '@types/node': 26.6.6
  '@vitest/browser-playwright': 5.1.0
  '@vitest/coverage-v8': 5.1.0
  eslint-plugin-sonarjs: 4.2.2
  eslint-plugin-turbo: 2.11.11
  knip: 6.45.1
  lefthook: 2.2.1
  oxfmt: 0.78.0
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2007
  playwright: 1.65.0
  rimraf: 6.1.4
  rolldown: 1.3.2
  tsdown: 0.23.7
  turbo: 2.11.11
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.1.0

# New dependencies must go through the catalog, at exact versions.
catalogMode: strict
cleanupUnusedCatalogs: true
saveExact: true
strictDepBuilds: true

# Supply-chain checks: no version younger than a week, none published with weaker provenance than an earlier one, and no transitive git or tarball dependencies.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

# Only these packages may run install scripts; any other fails the install.
allowBuilds:
  lefthook: true
