name: Set up exemplar-tests
description:
  Checks out exemplar-tests, on the pull request's branch name or else main, beside the exemplar checkout in `exemplar`,
  builds exemplar and installs exemplar-tests.

inputs:
  bun:
    description: Install Bun too.
    default: 'false'
  java:
    description: Install a JDK too, for the Xerces and javax.xml.catalog differentials.
    default: 'false'
  xmllint:
    description: Install xmllint too, for the libxml2 differentials.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: ./exemplar/.github/actions/checkout-sibling
      with:
        repository: exemplar-tests
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: exemplar/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: exemplar-tests/.node-version
        cache: pnpm
        cache-dependency-path: '*/pnpm-lock.yaml'
    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - if: inputs.java == 'true'
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: 21
    - if: inputs.xmllint == 'true'
      run: sudo apt-get install --yes libxml2-utils
      shell: bash
    # The XML suite is downloaded on first use, as its licence requires; the cache keeps it between runs.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: exemplar-tests/data/conformance/xmlts
        key: w3c-xmlts-${{ hashFiles('exemplar-tests/tools/conformance/suites.json') }}
    - name: Build exemplar
      shell: bash
      working-directory: exemplar
      run: pnpm install --frozen-lockfile && pnpm compile
    - name: Install exemplar-tests
      shell: bash
      working-directory: exemplar-tests
      run: pnpm install --frozen-lockfile && pnpm compile
