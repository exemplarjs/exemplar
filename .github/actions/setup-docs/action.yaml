name: Set up exemplar-docs
description:
  Checks out exemplar-docs, on the pull request's branch name or else main, beside the exemplar checkout in `exemplar`,
  builds exemplar and installs exemplar-docs.

runs:
  using: composite
  steps:
    - uses: ./exemplar/.github/actions/checkout-sibling
      with:
        repository: exemplar-docs
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: exemplar/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: exemplar-docs/.node-version
        cache: pnpm
        cache-dependency-path: '*/pnpm-lock.yaml'
    - name: Build exemplar
      shell: bash
      working-directory: exemplar
      run: pnpm install --frozen-lockfile && pnpm compile
    - name: Install exemplar-docs
      shell: bash
      working-directory: exemplar-docs
      run: pnpm install --frozen-lockfile
