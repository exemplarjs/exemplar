name: Docs release

# Adds a release's benchmark report to exemplar-docs as a pull request, called by the release workflow or started by hand.
on:
  workflow_call:
    inputs:
      version:
        description: The released version, such as 0.2.0.
        required: true
        type: string
      dry-run:
        description: Commit locally and stop, without pushing or opening a pull request.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: The released version, such as 0.2.0.
        required: true
        type: string
      run-id:
        description: The release run whose bench-report artifact to use.
        required: true
        type: string
      dry-run:
        description: Commit locally and stop, without pushing or opening a pull request.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docs-release:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Reads the report from a release run other than this one.
      actions: read
    # Holds the credentials of the GitHub App that may write to exemplar-docs, and nothing else may read them.
    environment: docs
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: The version is a version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version."; exit 1
          fi
      - name: Create a token for exemplar-docs
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: exemplar-docs
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-report
          path: report
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/exemplar-docs
          token: ${{ steps.app.outputs.token }}
          path: exemplar-docs
      - name: Add the report
        working-directory: exemplar-docs
        run: |
          rm -rf "docs/public/benchmarks/$VERSION"
          mkdir -p "docs/public/benchmarks/$VERSION"
          cp -R "$GITHUB_WORKSPACE"/report/. "docs/public/benchmarks/$VERSION/"
      - name: Commit the report
        working-directory: exemplar-docs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git switch -C "benchmarks/$VERSION"
          git add docs/public/benchmarks
          git diff --cached --quiet || git commit -m "docs: add the benchmark report for $VERSION"
      - name: Show the commit
        if: ${{ inputs.dry-run }}
        working-directory: exemplar-docs
        run: git show --stat --format=%B HEAD
      - name: Open the pull request
        if: ${{ !inputs.dry-run }}
        working-directory: exemplar-docs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git push --force origin "benchmarks/$VERSION"
          gh pr view "benchmarks/$VERSION" > /dev/null 2>&1 || gh pr create \
            --head "benchmarks/$VERSION" \
            --title "docs: benchmark report for $VERSION" \
            --body "The full benchmark matrix for exemplar $VERSION, from the release workflow."
