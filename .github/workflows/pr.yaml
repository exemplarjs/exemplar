name: PR

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repositories it checks out.
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml

  # SonarQube Cloud, with a short-lived token from GitHub's OIDC login and no stored secret.
  sonar:
    needs: checks
    # Pull requests from forks and from Dependabot get no OIDC token, so they skip the scan.
    if:
      ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      # The whole history, which SonarQube Cloud reads to tell new code from old.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # The token lasts 30 minutes, so this step stays right before the scan.
      - uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        id: auth
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          args: >
            -Dsonar.organization=${{ steps.auth.outputs.organization }} -Dsonar.projectKey=${{
            steps.auth.outputs.project-key }}
