name: Checks

# Every check a change must pass, shared by the pull request and release workflows.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint:ci
      - run: pnpm typecheck

  # The unit tests, one job for each place the library runs.
  test:
    name: Tests on ${{ matrix.target }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Node
            command: pnpm test:coverage
          - target: Bun
            command: pnpm test:bun
            bun: true
          - target: Chromium
            command: pnpm test:browser --project '*(chromium)'
            browser: chromium
          - target: Firefox
            command: pnpm test:browser --project '*(firefox)'
            browser: firefox
          - target: WebKit
            command: pnpm test:browser --project '*(webkit)'
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          bun: ${{ matrix.bun || false }}
      - if: matrix.browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: ${{ matrix.command }}
      - if: matrix.target == 'Node'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info

  # exemplar-tests' branch of the same name, or else its main, run on this change's build.
  conformance:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: exemplar
      - uses: ./exemplar/.github/actions/setup-tests
        with:
          bun: true
          xmllint: true
      - name: Lint and type-check exemplar-tests
        working-directory: exemplar-tests
        run: pnpm lint:ci && pnpm typecheck
      - name: Run the suites on Node
        working-directory: exemplar-tests
        run: pnpm conformance
      - name: Run the XML suite on Bun
        working-directory: exemplar-tests
        run: bun tools/conformance/src/cli.ts exemplar

  # exemplar-docs' branch of the same name, or else its main: type-checks every sample against this change's build.
  docs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: exemplar
      - uses: ./exemplar/.github/actions/setup-docs
      - name: Build the site
        working-directory: exemplar-docs
        run: pnpm build
